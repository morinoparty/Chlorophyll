version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️"
    groups:
      # catalog の vite (vite-plus-core の別名) と vite-plus は同じバージョンで揃える必要があるため、まとめて上げる
      vite-plus:
        patterns:
          - "vite-plus"
          - "@voidzero-dev/vite-plus-*"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️"
    groups:
      docs-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️"
    groups:
      github-actions:
        patterns:
          - "*"
