# docs (Worker "chlorophyll") を cf で deploy する。
# Storybook は docs の静的アセットとして /storybook/ 配下に同梱する (docs/vite.config.ts)。
#
# build と dry-run を行い、main のときだけ本番 deploy する。
# 必要な secret (cf CLI 用。Worker には渡さない):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Worker はアプリ用の secret を持たないので --secrets-file は使わない。
name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7

      # Vite+ (vp)、Node (.node-version)、pnpm (package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま install する。vp のバージョンは catalog の vite-plus から決まる
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      # Vite Task の結果 (Storybook のビルド) を run をまたいで再利用する。install が作る node_modules に戻すので install の後に置く。
      # 入力の変化は Vite Task が判定するため、key には run ごとの値だけを入れて最新のものを戻す。
      # 同じ run で並行する他のジョブと key が重ならないよう、ジョブごとの名前を入れる
      - name: Restore Vite Task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      # cf build は package.json の scripts を通らないので、生成物は先に作る。
      # storybook-static は docs の cf build (Vite) が /storybook/ 配下にコピーする
      - name: Build storybook
        run: pnpm run build:storybook

      # 後続の手順が失敗してもキャッシュを残せるよう、ビルド直後に保存する
      - name: Save Vite Task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

      - name: Generate docs assets
        run: pnpm --filter @chlorophyll/docs generate

      # docs は TanStack Start と判定され、cf build は --mode を受け付けない (Vite のビルドは production を記録する)
      - name: Build docs worker
        working-directory: docs
        run: |
          pnpm exec cf build
          pnpm exec cf deploy --prebuilt --mode production --dry-run

      # 本番 deploy は main のときだけ
      - name: Deploy docs
        if: github.ref == 'refs/heads/main'
        working-directory: docs
        run: pnpm exec cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
