name: Publish React Package

# GitHub Release を draft から publish したときにだけ公開する。
# 手動実行 (workflow_dispatch) やタグ push では公開しない — リリースノートと
# 公開済みバージョンがずれる事故 (draft のまま 0.3.0 が publish された) の再発防止。
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm (package.json の packageManager) と Node (.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          cache: true      # pnpm store を lockfile ごとにキャッシュ
          install: false   # install は次の手順で --frozen-lockfile 付きで行う

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # リリースのタグ (v0.4.0) を package.json の version に反映してから publish する。
      # リポジトリ側の version は据え置きなので、ここで必ず置き換える
      - name: Set version from the release tag
        working-directory: packages/react
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::release tag is empty"
            exit 1
          fi
          # npm は使わず、node で package.json の version だけを書き換える
          VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 4) + "\n");
          '
          echo "publishing @morinoparty/chlorophyll-react@$VERSION"

      # setup-node の registry-url / scope の代わりに ~/.npmrc を書く
      # (publish 先は packages/react の publishConfig.registry = GitHub Packages)
      - name: Authenticate to GitHub Packages
        run: |
          echo "@morinoparty:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        working-directory: packages/react
        run: pnpm publish --no-git-checks --access public
