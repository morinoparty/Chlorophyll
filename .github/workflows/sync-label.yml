name: Sync Labels

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/labels.json"

permissions:
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm と Node (.node-version) をまとめて入れる。依存は install しないのでキャッシュもしない
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false

      - name: Remove color prefix
        run: sed -i 's/#//g' .github/labels.json

      - name: Run github-label-setup
        run: pnpm dlx @azu/github-label-setup --token ${{ secrets.GITHUB_TOKEN }} --labels .github/labels.json
