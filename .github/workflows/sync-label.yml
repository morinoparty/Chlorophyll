name: Sync Labels

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/labels.json"

permissions:
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vite+ (vp)、pnpm と Node (.node-version) をまとめて入れる。依存は install しないのでキャッシュもしない
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false

      - name: Remove color prefix
        run: sed -i 's/#//g' .github/labels.json

      - name: Run github-label-setup
        run: pnpm dlx @azu/github-label-setup --token ${{ secrets.GITHUB_TOKEN }} --labels .github/labels.json
