name: Accessibility Test

on:
  workflow_call:
    outputs:
      test_total:
        value: ${{ jobs.test.outputs.test_total }}
      test_passed:
        value: ${{ jobs.test.outputs.test_passed }}
      test_failed:
        value: ${{ jobs.test.outputs.test_failed }}
      test_skipped:
        value: ${{ jobs.test.outputs.test_skipped }}
      test_result:
        value: ${{ jobs.test.outputs.test_result }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      test_total: ${{ steps.parse.outputs.total }}
      test_passed: ${{ steps.parse.outputs.passed }}
      test_failed: ${{ steps.parse.outputs.failed }}
      test_skipped: ${{ steps.parse.outputs.skipped }}
      test_result: ${{ steps.test.outcome }}
    steps:
      - uses: actions/checkout@v7

      # Vite+ (vp)、Node (.node-version)、pnpm (package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま install する。vp のバージョンは catalog の vite-plus から決まる
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # test-storybook uses the same Playwright version as @chlorophyll/storybook (chromium headless shell)
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @chlorophyll/storybook exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @chlorophyll/storybook exec playwright install-deps chromium

      # Vite Task の結果 (Storybook のビルド) を run をまたいで再利用する。install が作る node_modules に戻すので install の後に置く。
      # 入力の変化は Vite Task が判定するため、key には run ごとの値だけを入れて最新のものを戻す。
      # 同じ run で並行する他のジョブと key が重ならないよう、ジョブごとの名前を入れる
      - name: Restore Vite Task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-a11y-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      # build:storybook は vite.config.ts の build-storybook タスクを実行し、
      # 入力が変わっていなければ前回の storybook-static をキャッシュから戻す
      - name: Build Storybook
        run: pnpm run build:storybook

      # 後続の手順が失敗してもキャッシュを残せるよう、ビルド直後に保存する
      - name: Save Vite Task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm --filter @chlorophyll/storybook test:runner

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: 'storybook/reports/junit.xml'
          # テストは実行・注釈するが、結果失敗で merge をブロックする check は作らない
          annotate_only: true
          fail_on_failure: false
          fail_on_parse_error: false

      - name: Parse JUnit results
        id: parse
        if: ${{ !cancelled() }}
        run: |
          if [ -f storybook/reports/junit.xml ]; then
            python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET

          tree = ET.parse('storybook/reports/junit.xml')
          root = tree.getroot()

          # testsuites (root) or individual testsuite
          if root.tag == 'testsuites':
              tests = int(root.get('tests', 0))
              failures = int(root.get('failures', 0))
              skipped = int(root.get('skipped', 0))
          else:
              tests = int(root.get('tests', 0))
              failures = int(root.get('failures', 0))
              skipped = int(root.get('skipped', 0))

          passed = tests - failures - skipped

          print(f'total={tests}')
          print(f'passed={passed}')
          print(f'failed={failures}')
          print(f'skipped={skipped}')
          PYEOF
          else
            echo "total=0" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "skipped=0" >> "$GITHUB_OUTPUT"
          fi
