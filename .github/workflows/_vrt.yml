name: Visual Regression Test

# puppeteer(高 DPI)でスクリーンショットを取得し、reg-suit で差分検出する。
# 撮影は CPU(SwiftShader)律速なので、build → capture(matrix で分割)→ vrt(集約して reg-suit)に分け、
# ランナーを増やして並列化する。
# - reg-keygen-git-hash-plugin: git 履歴から比較対象のベースコミットを特定
# - reg-publish-s3-plugin: 期待値スナップショット / 実行結果 / レポートを R2(S3 互換) で授受
# - reg-notify-github-plugin: PR コメントと commit status で結果を通知
on:
  workflow_call:

env:
  # R2(S3 互換) の接続先。reg-publish-s3-plugin が AWS SDK 経由で参照する。
  # バケット・エンドポイント・公開 URL・認証情報は同じ組の MORINOPARTY_CI_* から揃えて取る
  AWS_EC2_METADATA_DISABLED: true
  AWS_REGION: ${{ secrets.MORINOPARTY_CI_AWS_REGION }}
  # regconfig.json が ${VAR} で展開する値
  S3_UPLOAD_BUCKET: ${{ secrets.MORINOPARTY_CI_S3_UPLOAD_BUCKET }}
  S3_ENDPOINT: ${{ secrets.MORINOPARTY_CI_S3_ENDPOINT }}
  # 公開ベース URL (例: https://pub-xxx.r2.dev、末尾スラッシュなし)。レポート URL の組み立てに使う
  S3_PUBLIC_URL: ${{ secrets.MORINOPARTY_CI_S3_PUBLIC_URL }}
  REG_NOTIFY_GITHUB_CLIENT_ID: ${{ secrets.REG_NOTIFY_GITHUB_CLIENT_ID }}

jobs:
  # Storybook のビルドは 1 回だけ行い、各撮影ジョブに配る
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Vite+ (vp)、Node (.node-version)、pnpm (package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま install する。vp のバージョンは catalog の vite-plus から決まる
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      # Vite Task の結果 (Storybook のビルド) を run をまたいで再利用する。install が作る node_modules に戻すので install の後に置く。
      # 入力の変化は Vite Task が判定するため、key には run ごとの値だけを入れて最新のものを戻す。
      # 同じ run で並行する他のジョブと key が重ならないよう、ジョブごとの名前を入れる
      - name: Restore Vite Task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-vrt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      # build:storybook は vite.config.ts の build-storybook タスクを実行し、
      # 入力が変わっていなければ前回の storybook-static をキャッシュから戻す
      - name: Build Storybook
        run: pnpm run build:storybook

      # 後続の手順が失敗してもキャッシュを残せるよう、ビルド直後に保存する
      - name: Save Vite Task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook/storybook-static
          retention-days: 1

  # ストーリーを VRT_SHARD で分割し、ランナーごとに担当分だけを撮影する
  capture:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7

      # Vite+ (vp)、Node (.node-version)、pnpm (package.json の packageManager) をまとめて入れる。
      # vp のバージョンは catalog の vite-plus から決まる
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: false # Puppeteer のキャッシュを戻してから --frozen-lockfile 付きで install する

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm のストアキャッシュがあると install 時の postinstall がスキップされ
      # Chromium が未取得になることがあるため、明示的に取得する(冪等・有れば即終了)
      - name: Ensure Puppeteer Chromium
        run: pnpm --filter @chlorophyll/storybook exec puppeteer browsers install chrome

      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook/storybook-static

      # puppeteer でビルド済み Storybook を巡回し、担当分を高 DPI で __screenshots__ に保存
      # 1 台の中で複数ページを同時に撮ると、ブラウザ全体が止まる区間が出たうえ、
      # 描画の揺れで画素差分が増えた(直列同士 4 枚 → 並列 20〜28 枚)。
      # 並列化はランナーを分けることで行い、ジョブの中は直列で撮る
      - name: Capture screenshots
        env:
          VRT_SHARD: ${{ matrix.shard }}/6
          VRT_CONCURRENCY: 1
        run: pnpm --filter @chlorophyll/storybook vrt:capture

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.shard }}
          path: storybook/__screenshots__
          retention-days: 1

  # 全シャードの撮影結果を 1 つにまとめ、reg-suit でベースラインと比較する
  vrt:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # reg-keygen-git-hash-plugin がベースコミットを辿るため全履歴が必要
          fetch-depth: 0

      # PR では checkout がマージコミットを detached HEAD で取得し、
      # reg-keygen-git-hash-plugin がブランチ名を取得できず落ちる。
      # HEAD を名前付きブランチに戻して回避する(PR: head_ref / push: ref_name)。
      - name: Restore branch name for reg-keygen (detached HEAD workaround)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git checkout -B "$BRANCH"

      # Vite+ (vp)、Node (.node-version)、pnpm (package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま install する。vp のバージョンは catalog の vite-plus から決まる
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      # シャードごとの __screenshots__ はパスが重ならないので、そのまま 1 つのディレクトリに重ねる
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          path: storybook/__screenshots__
          merge-multiple: true

      # reg-suit がベースラインと比較し、結果を R2 へ公開して GitHub に通知する
      - name: Run reg-suit
        env:
          # 認証情報はアップロードするこのステップだけに渡す
          AWS_ACCESS_KEY_ID: ${{ secrets.MORINOPARTY_CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MORINOPARTY_CI_AWS_SECRET_ACCESS_KEY }}
        run: |
          # regconfig.json は未設定の値を "undefined" という文字列に展開するため、
          # secret が空のまま進むと誤ったバケットや URL を使ってしまう。ここで止める
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_ENDPOINT S3_UPLOAD_BUCKET S3_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty (check the MORINOPARTY_CI_* organization secrets)"
              exit 1
            fi
          done

          # reg-publish-s3-plugin の customDomain は https:// を付けずに渡す必要があるため、スキームを外す
          public_host="${S3_PUBLIC_URL#https://}"
          export S3_PUBLIC_HOST="${public_host%/}"

          pnpm --filter @chlorophyll/storybook vrt:run
