name: Visual Regression Test

# puppeteer(高 DPI)でスクリーンショットを取得し、reg-suit で差分検出する。
# - reg-keygen-git-hash-plugin: git 履歴から比較対象のベースコミットを特定
# - reg-publish-s3-plugin: 期待値スナップショット / 実行結果 / レポートを R2(S3 互換) で授受
# - reg-notify-github-plugin: PR コメントと commit status で結果を通知
on:
  workflow_call:

env:
  # R2(S3 互換) 認証情報。reg-publish-s3-plugin が AWS SDK 経由で参照する
  AWS_EC2_METADATA_DISABLED: true
  AWS_REGION: auto
  # regconfig.json が ${VAR} で展開する値
  S3_UPLOAD_BUCKET: ${{ secrets.S3_UPLOAD_BUCKET }}
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  REG_NOTIFY_GITHUB_CLIENT_ID: ${{ secrets.REG_NOTIFY_GITHUB_CLIENT_ID }}

jobs:
  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # reg-keygen-git-hash-plugin がベースコミットを辿るため全履歴が必要
          fetch-depth: 0

      # PR では checkout がマージコミットを detached HEAD で取得し、
      # reg-keygen-git-hash-plugin がブランチ名を取得できず落ちる。
      # HEAD を名前付きブランチに戻して回避する(PR: head_ref / push: ref_name)。
      - name: Restore branch name for reg-keygen (detached HEAD workaround)
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git checkout -B "$BRANCH"

      # pnpm (package.json の packageManager) と Node (.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          cache: true      # pnpm store を lockfile ごとにキャッシュ
          install: false   # install は次の手順で --frozen-lockfile 付きで行う

      - name: Cache Puppeteer Chromium
        id: puppeteer-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm のストアキャッシュがあると install 時の postinstall がスキップされ
      # Chromium が未取得になることがあるため、明示的に取得する(冪等・有れば即終了)
      - name: Ensure Puppeteer Chromium
        run: pnpm --filter @chlorophyll/storybook exec puppeteer browsers install chrome

      - name: Build Storybook
        run: pnpm --filter @chlorophyll/storybook build

      # puppeteer でビルド済み Storybook を巡回し、高 DPI で __screenshots__ に保存
      - name: Capture screenshots
        run: pnpm --filter @chlorophyll/storybook vrt:capture

      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            37e4d53a-a898-4e9f-b067-b49900deaf4f > AWS_ACCESS_KEY_ID
            4d92b739-40fc-467f-97fa-b49900deb52c > AWS_SECRET_ACCESS_KEY

      # reg-suit がベースラインと比較し、結果を R2 へ公開して GitHub に通知する
      - name: Run reg-suit
        run: pnpm --filter @chlorophyll/storybook vrt:run
