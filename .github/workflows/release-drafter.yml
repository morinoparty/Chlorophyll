name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # v7 は token 入力 (既定値 github.token) を使うので GITHUB_TOKEN の env は不要
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
