name: Preview Deploy

on:
  workflow_call:
    outputs:
      storybook_url:
        value: ${{ jobs.deploy.outputs.storybook_url }}
      docs_url:
        value: ${{ jobs.deploy.outputs.docs_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    outputs:
      # Storybook は docs Worker の /storybook/ 配下で配信する
      storybook_url: ${{ steps.deploy-docs-preview.outputs.storybook-url }}
      docs_url: ${{ steps.deploy-docs-preview.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      # Vite+ (vp)、Node (.node-version)、pnpm (package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま install する。vp のバージョンは catalog の vite-plus から決まる
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      # Vite Task の結果 (Storybook のビルド) を run をまたいで再利用する。install が作る node_modules に戻すので install の後に置く。
      # 入力の変化は Vite Task が判定するため、key には run ごとの値だけを入れて最新のものを戻す。
      # 同じ run で並行する他のジョブと key が重ならないよう、ジョブごとの名前を入れる
      - name: Restore Vite Task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-preview-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      # cf は package.json の scripts を通らないので、生成物は先に作る。
      # storybook-static は docs のビルド (Vite) が /storybook/ 配下にコピーする
      - name: Build storybook
        run: pnpm run build:storybook

      # 後続の手順が失敗してもキャッシュを残せるよう、ビルド直後に保存する
      - name: Save Vite Task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

      - name: Generate docs assets
        run: pnpm --filter @chlorophyll/docs generate

      # cf previews deploy はビルドしてから Worker Preview を作り、結果を JSON で標準出力に出す。
      # preview 名は GITHUB_HEAD_REF (PR のブランチ名) から決まる。
      - name: Deploy docs preview
        id: deploy-docs-preview
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec cf previews deploy > "$RUNNER_TEMP/docs-preview.json"
          cat "$RUNNER_TEMP/docs-preview.json"
          url=$(jq -r '(.preview_urls // .deployment_urls) | if type == "array" then .[0] else . end // empty' "$RUNNER_TEMP/docs-preview.json")
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then echo "storybook-url=${url%/}/storybook/" >> "$GITHUB_OUTPUT"; fi
