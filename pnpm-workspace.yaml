packages:
  - "packages/*"
  - "docs"
  - "storybook"

# pnpm 11 以降は package.json の "pnpm" 欄を読まないため、ここに移した
overrides:
  three: ^0.187.0
  "@types/three": ^0.187.0
  jest-runtime: ~30.5.2

# install スクリプトの実行を許可する依存 (pnpm 11 以降は未承認だと install が失敗する)
allowBuilds:
  puppeteer: true
  # cf / @cloudflare/vite-plugin がビルドとローカル実行に使う
  esbuild: true
  workerd: true
  # 以前から実行していなかったもの
  sharp: false
  "@swc/core": false
  unrs-resolver: false
  # @pandacss/dev (watch) と jest-haste-map が使う。プラットフォーム別のビルド済みバイナリがあるのでソースビルドは不要
  "@parcel/watcher": false
